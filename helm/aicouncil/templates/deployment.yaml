apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicouncil
  labels:
    app: aicouncil
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: aicouncil
  template:
    metadata:
      labels:
        app: aicouncil
    spec:
      containers:
        - name: aicouncil
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            {{- $secretName := .Values.existingSecret | default (and (or .Values.secrets.GROQ_API_KEY .Values.secrets.GOOGLE_API_KEY) "aicouncil-secrets") }}
            {{- if $secretName }}
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GROQ_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: GOOGLE_API_KEY
                  optional: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
