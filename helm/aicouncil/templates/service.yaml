apiVersion: v1
kind: Service
metadata:
  name: aicouncil
  labels:
    app: aicouncil
spec:
  type: {{ .Values.service.type }}
  selector:
    app: aicouncil
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
